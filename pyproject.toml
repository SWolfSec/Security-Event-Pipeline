[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-event-pipeline"
version = "0.1.0"
description = "Local security event normalization, detection, and correlation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
security-event-pipeline = "security_event_pipeline.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
strict = true
files = ["src/security_event_pipeline"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
